appId: com.a1quantumoracleai.app
productName: A1 Quantum Oracle AI
copyright: Copyright © 2026 A1 Quantum Oracle AI
npmRebuild: false

directories:
  output: release
  buildResources: frontend/assets

files:
  - electron/**/*
  - frontend/assets/**/*
  - frontend/.next/standalone/**/*
  - frontend/.next/static/**/*
  - frontend/public/**/*
  - package.json

extraResources:
  - from: frontend/.next/standalone
    to: app/next-standalone
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: frontend/assets/icons/icon.png
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: frontend/assets/icons/icon.png
  artifactName: ${productName}-${version}.${ext}
  category: public.app-category.utilities

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: frontend/assets/icons/icon.png
  artifactName: ${productName}-${version}.${ext}
  category: Utility

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: A1 Quantum Oracle AI

publish: null
